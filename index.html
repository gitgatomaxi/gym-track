<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym & Dieta</title>
    <style>
        /* Variables de color premium */
        :root {
            --bg-color: #0d0d0d;
            --glass-bg: rgba(30, 30, 30, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-cyan: #00ffcc;
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            /* Evita el scroll y rebotes raros en iOS/Android */
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Encabezado fijo con efecto de vidrio esmerilado */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 60px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        header h1 {
            font-size: 1.2rem;
            margin: 0;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }

        /* Carrusel superior de días */
        #carrusel-dias {
            position: fixed;
            top: 60px;
            width: 100%;
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding: 15px 20px;
            background: var(--bg-color);
            z-index: 90;
            box-sizing: border-box;
            /* Ocultar barra de scroll en distintos navegadores */
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        #carrusel-dias::-webkit-scrollbar {
            display: none;
        }

        .burbuja-dia {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: capitalize;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .burbuja-dia.activa {
            background: var(--neon-cyan);
            color: #000;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }

        /* Burbuja del temporizador clavada fija a la izquierda de Lunes */
        #burbuja-timer {
            position: sticky;
            left: 0;
            z-index: 10;
            flex-shrink: 0;
            background: #181818;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: -20px 0 0 var(--bg-color), 8px 0 12px var(--bg-color);
        }
        #burbuja-timer.activa {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: -20px 0 0 var(--bg-color), 8px 0 12px var(--bg-color), 0 0 10px rgba(0, 255, 204, 0.5);
        }

        /* Consola del Temporizador y Contador de Series */
        .timer-reloj {
            font-size: 2.8rem;
            font-weight: 800;
            text-align: center;
            color: var(--neon-cyan);
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.35);
            margin: 6px 0 10px 0;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
        }
        .serie-badge {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid var(--neon-cyan);
            color: #fff;
            border-radius: 12px;
            padding: 10px 12px;
            text-align: center;
            font-weight: bold;
            font-size: 1.05rem;
            margin-bottom: 14px;
            cursor: pointer;
            user-select: none;
        }
        .serie-badge:active {
            transform: scale(0.97);
            background: rgba(0, 255, 204, 0.25);
        }
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .timer-btn {
            background: #252525;
            border: 1px solid var(--glass-border);
            color: #fff;
            border-radius: 12px;
            padding: 12px 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .timer-btn:active {
            background: var(--neon-cyan);
            color: #000;
        }
        .timer-btn.stop {
            background: rgba(255, 70, 70, 0.15);
            border-color: rgba(255, 70, 70, 0.4);
            color: #ff6b6b;
        }
        @keyframes pulsoNeon {
            0%, 100% { box-shadow: 0 0 8px rgba(0,255,204,0.3); border-color: var(--glass-border); }
            50% { box-shadow: 0 0 28px rgba(0,255,204,0.95); border-color: var(--neon-cyan); }
        }
        .alerta-neon {
            animation: pulsoNeon 0.6s infinite;
        }

        /* Contenedor principal ajustado para dar espacio al carrusel */
        main {
            padding: 130px 20px 90px 20px;
            overflow-x: hidden; /* Clave para que la animación no rompa el ancho de pantalla */
        }

        /* Clase para la animación fluida de las tarjetas */
        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        /* Estados de animación para la tarjeta */
        .card.saliendo-izq { transform: translateX(-100%); opacity: 0; }
        .card.saliendo-der { transform: translateX(100%); opacity: 0; }
        .card.entrando-izq { transform: translateX(-100%); opacity: 0; }
        .card.entrando-der { transform: translateX(100%); opacity: 0; }

        /* Tarjetas de contenido */
        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            margin-top: 0;
            color: var(--neon-cyan);
            font-size: 1.1rem;
            text-transform: uppercase;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
        }

        .seccion { margin-top: 15px; }
        
        .etiqueta {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        /* Skeleton Loaders (Efecto animado mientras baja los datos de Google Sheets) */
        .skeleton {
            background: linear-gradient(90deg, #222 25%, #333 50%, #222 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 4px;
            height: 20px;
            margin-bottom: 10px;
        }
        .skeleton.title { width: 50%; height: 24px; }
        .skeleton.text { width: 100%; height: 60px; }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Barra de navegación inferior (Bottom Nav) */
        nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 70px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            transition: color 0.3s ease;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--neon-cyan);
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            fill: currentColor;
        }

        /* Bottom Sheet (Panel flotante del Chat) */
        #chat-sheet {
            position: fixed;
            bottom: -100%; /* Oculto por defecto abajo de la pantalla */
            left: 0;
            width: 100%;
            height: 75vh;
            background: #1a1a1a;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -5px 40px rgba(0,0,0,0.6);
            z-index: 200;
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
        }

        #chat-sheet.open {
            bottom: 0;
        }

        .chat-header {
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--neon-cyan);
            font-size: 1.8rem;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .chat-body {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
        }

        .chat-input-area {
            padding: 15px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 10px;
            background: #121212;
        }

        .chat-input-area input {
            flex-grow: 1;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 20px;
            padding: 12px 15px;
            outline: none;
            font-family: inherit;
        }

        .chat-input-area input:focus {
            border-color: var(--neon-cyan);
        }

        .chat-input-area button {
            background: var(--neon-cyan);
            color: #000;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Fondo oscuro al abrir el chat */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 150;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #overlay.active { display: block; opacity: 1; }

        /* --- MODO APPLE WATCH SERIES 7 (Ancho <= 330px y Alto <= 520px) --- */
        @media (max-width: 330px) and (max-height: 520px) {
            header {
                height: 40px;
            }
            header h1 {
                font-size: 1.15rem;
            }
            #carrusel-dias {
                top: 40px;
                padding: 10px 12px;
                gap: 10px;
            }
            /* Burbujas de los días más grandes para compensar el zoom del reloj */
            .burbuja-dia {
                padding: 11px 18px;
                font-size: 1.1rem;
                border-radius: 22px;
            }
            main {
                padding: 100px 6px 75px 6px;
            }
            .card {
                padding: 14px 12px;
                border-radius: 14px;
                margin-bottom: 12px;
            }
            .card h2 {
                font-size: 1.15rem;
                padding-bottom: 8px;
            }
            #texto-entrenamiento, #texto-dieta {
                font-size: 1.05rem;
                line-height: 1.45;
            }
            nav {
                height: 64px;
            }
            .nav-item {
                font-size: 0.85rem;
                padding: 6px 10px;
            }
            .nav-item svg {
                width: 24px;
                height: 24px;
                margin-bottom: 3px;
            }
            /* Forzar que el chat ocupe el 100% real de alto y ancho en watchOS */
            #chat-sheet {
                width: 100%;
                height: 100%;
                max-height: 100%;
                border-radius: 0;
                box-sizing: border-box;
            }
            #chat-sheet.open {
                top: 0;
                bottom: 0;
                height: 100vh;
                height: 100dvh;
            }
            .chat-header {
                padding: 12px 16px;
                font-size: 1.1rem;
                box-sizing: border-box;
            }
            .close-btn {
                font-size: 2.2rem;
                padding: 2px 12px;
            }
            .chat-body {
                padding: 10px 8px;
                box-sizing: border-box;
            }
            .burbuja-chat {
                max-width: 94% !important;
                padding: 12px 14px !important;
                font-size: 1.05rem !important;
                margin: 8px 0 !important;
                box-sizing: border-box;
            }
            /* Margen lateral e inferior extra para esquivar la curva física del reloj */
            .chat-input-area {
                width: 100%;
                box-sizing: border-box;
                padding: 10px 14px 16px 14px;
                gap: 8px;
                align-items: center;
            }
            /* min-width: 0 evita que la caja de texto empuje al botón fuera de pantalla */
            .chat-input-area input {
                min-width: 0;
                width: 100%;
                box-sizing: border-box;
                padding: 12px 14px;
                font-size: 1.05rem;
            }
            .chat-input-area button {
                width: 48px;
                height: 48px;
                flex-shrink: 0;
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header Superior -->
    <header>
        <h1><span style="color:var(--text-main);">GYM</span><span style="color:var(--neon-cyan);">TRACK</span></h1>
    </header>

    <!-- Carrusel de días -->
    <div id="carrusel-dias">
        <!-- Las burbujas se inyectarán acá con JS -->
    </div>

    <!-- Contenido Principal -->
    <main id="pantalla-plan">
        <div class="card" id="tarjeta-principal">
            <h2 id="dia-titulo">Cargando Hoy...</h2>
            
            <!-- Skeleton Loaders -->
            <div id="loaders">
                <div class="skeleton title"></div>
                <div class="skeleton text"></div>
                <br>
                <div class="skeleton title"></div>
                <div class="skeleton text"></div>
            </div>

            <!-- Contenedor de datos (Oculto hasta la Fase 4) -->
            <div id="datos-reales" style="display: none;">
                <div class="seccion">
                    <div class="etiqueta">🏋️ Entrenamiento</div>
                    <div id="texto-entrenamiento"></div>
                </div>
                <div class="seccion">
                    <div class="etiqueta">🥩 Nutrición</div>
                    <div id="texto-dieta"></div>
                </div>
            </div>

            <!-- Consola del Temporizador y Series (Oculta hasta tocar la burbuja ⏱️) -->
            <div id="consola-timer" style="display: none;">
                <div class="timer-reloj" id="reloj-display">00:00</div>
                <div class="serie-badge" onclick="reiniciarSeries()">
                    🔥 Serie actual: <span id="num-serie" style="color: var(--neon-cyan); font-size: 1.2rem;">0</span>
                    <div style="font-size: 0.72rem; color: var(--text-muted); font-weight: normal; margin-top: 3px;">
                        (Tocá acá al cambiar de ejercicio para volver a 0)
                    </div>
                </div>
                <div class="timer-grid">
                    <button class="timer-btn" onclick="iniciarTimer(60)">60s</button>
                    <button class="timer-btn" onclick="iniciarTimer(90)">90s</button>
                    <button class="timer-btn" onclick="iniciarTimer(120)">2m</button>
                    <button class="timer-btn" onclick="iniciarTimer(180)">3m</button>
                    <button class="timer-btn" onclick="iniciarTimer(240)">4m</button>
                    <button class="timer-btn stop" onclick="detenerTimer()">⏹️ 00:00</button>
                </div>
            </div>
        </div>
        <!-- Tarjeta de Perfil (Oculta por defecto) -->
        <div class="card" id="tarjeta-perfil" style="display: none;">
            <h2>👤 Mi Perfil Biométrico</h2>
            <div id="perfil-datos-reales">
                <!-- Los datos se inyectarán acá con JS -->
            </div>
        </div>
    </main>

    <!-- Barra de Navegación Inferior -->
    <nav>
        <div class="nav-item active" id="btn-nav-hoy" onclick="cambiarVista('hoy')">
            <!-- Icono de Calendario/Plan -->
            <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10z"/></svg>
            Hoy
        </div>
        <div class="nav-item" id="btn-nav-perfil" onclick="cambiarVista('perfil')">
            <!-- Icono de Usuario/Perfil -->
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Perfil
        </div>
        <div class="nav-item" onclick="abrirChat()">
            <!-- Icono de Chat/IA -->
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/></svg>
            Asistente
        </div>
    </nav>

    <!-- Fondo desenfocado para el chat -->
    <div id="overlay" onclick="cerrarChat()"></div>

    <!-- Panel de Chat Desplegable (Bottom Sheet) -->
    <div id="chat-sheet">
        <div class="chat-header">
            <span>Asistente IA</span>
            <button class="close-btn" onclick="cerrarChat()">&times;</button>
        </div>
        <div class="chat-body" id="chat-mensajes">
            <p style="color: var(--text-muted); font-size: 0.9rem; text-align: center; margin-top: 20px;">
                Conectando con Gemini...<br>Conozco tu rutina y medidas de hoy. ¿Qué necesitas?
            </p>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input-text" placeholder="Consultar reemplazo de comida..." onkeypress="if(event.key === 'Enter') enviarMensaje()">
            <button onclick="enviarMensaje()">➤</button>
        </div>
    </div>

    <!-- Funciones base para probar la animación del Chat -->
    <script>
        // --- 1. CONFIGURACIÓN ---
        // ¡IMPORTANTE! Pegá acá adentro de las comillas la URL que te dio Google Apps Script en la Fase 2
        const API_URL = 'https://script.google.com/macros/s/AKfycby6lGq8fM58ba27w-irwB0aZQVzTELOMuAfoS6gKRDWGjz9l8ZffS2X9-FH-bZEmyGh/exec'; 
        
        let planSemanal = {};
        let perfilDatos = {}; // Nueva variable para guardar el perfil
        const diasSemana = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];
        const hoy = diasSemana[new Date().getDay()];

        // --- 2. LÓGICA DE CARGA DE DATOS DUAL ---
        async function cargarDatos() {
            try {
                // Llama a tu Google Sheet (ahora trae el paquete maestro)
                const respuesta = await fetch(API_URL);
                const datosMaestros = await respuesta.json();
                
                // Separamos los datos
                planSemanal = datosMaestros.plan;
                perfilDatos = datosMaestros.perfil;
                
                // Oculta los loaders animados y muestra los datos reales
                document.getElementById('loaders').style.display = 'none';
                document.getElementById('datos-reales').style.display = 'block';
                
                // Renderizar los datos del perfil en el HTML
                renderizarPerfil();
                
                // Muestra la rutina de hoy por defecto
                mostrarDia(hoy);
            } catch (error) {
                console.error("Error cargando los datos:", error);
                document.getElementById('dia-titulo').innerText = "Error de conexión ⚠️";
                document.getElementById('loaders').style.display = 'none';
            }
        }

        // Función para inyectar las métricas de perfil en la tarjeta oculta
        function renderizarPerfil() {
            const contenedorPerfil = document.getElementById('perfil-datos-reales');
            contenedorPerfil.innerHTML = ''; // Limpiar antes de inyectar
            
            for (const [atributo, valor] of Object.entries(perfilDatos)) {
                // Reemplazamos los guiones bajos por espacios para que se lea lindo
                const etiquetaLimpia = atributo.replace(/_/g, ' '); 
                const bloqueHtml = `
                    <div class="seccion">
                        <div class="etiqueta">${etiquetaLimpia}</div>
                        <div style="font-size: 1rem; color: #ddd;">${valor}</div>
                    </div>
                `;
                contenedorPerfil.innerHTML += bloqueHtml;
            }
        }

        // Función visual para alternar entre "Hoy" y "Perfil"
        function cambiarVista(vista) {
            // Retroalimentación háptica sutil
            if (navigator.vibrate) navigator.vibrate(30);

            const tarjetaPrincipal = document.getElementById('tarjeta-principal');
            const tarjetaPerfil = document.getElementById('tarjeta-perfil');
            const carruselDias = document.getElementById('carrusel-dias');
            
            const btnHoy = document.getElementById('btn-nav-hoy');
            const btnPerfil = document.getElementById('btn-nav-perfil');

            if (vista === 'hoy') {
                btnPerfil.classList.remove('active');
                btnHoy.classList.add('active');
                
                tarjetaPerfil.style.display = 'none';
                carruselDias.style.display = 'flex'; // Mostramos carrusel
                tarjetaPrincipal.style.display = 'block';
            } else if (vista === 'perfil') {
                btnHoy.classList.remove('active');
                btnPerfil.classList.add('active');
                
                carruselDias.style.display = 'none'; // Ocultamos carrusel
                tarjetaPrincipal.style.display = 'none';
                tarjetaPerfil.style.display = 'block';
            }
        }

        // --- 3. ANIMACIONES Y RENDERIZADO DE LA INTERFAZ ---
        let diaActualRenderizado = hoy;

        function inicializarCarrusel() {
            const contenedorCarrusel = document.getElementById('carrusel-dias');
            contenedorCarrusel.innerHTML = '';

            // 1. Crear primero la burbuja fija del Temporizador a la izquierda de Lunes
            const burbujaTimer = document.createElement('div');
            burbujaTimer.className = 'burbuja-dia';
            burbujaTimer.id = 'burbuja-timer';
            burbujaTimer.innerText = '⏱️';
            burbujaTimer.onclick = () => cambiarDiaConAnimacion('timer');
            contenedorCarrusel.appendChild(burbujaTimer);
            
            // 2. Reordenamos el array para que empiece el lunes
            const diasOrdenados = ['lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado', 'domingo'];
            
            diasOrdenados.forEach(dia => {
                const burbuja = document.createElement('div');
                burbuja.className = 'burbuja-dia';
                burbuja.id = 'burbuja-' + dia;
                burbuja.innerText = dia;
                
                burbuja.onclick = () => cambiarDiaConAnimacion(dia);
                contenedorCarrusel.appendChild(burbuja);
            });
        }

        function cambiarDiaConAnimacion(nuevoDia) {
            if (nuevoDia === diaActualRenderizado) return; // Si tocas el mismo día, no hace nada

            // Retroalimentación háptica sutil
            if (navigator.vibrate) navigator.vibrate(30);

            // Actualizar estilo visual de las burbujas
            document.querySelectorAll('.burbuja-dia').forEach(b => b.classList.remove('activa'));
            const burbujaActiva = document.getElementById('burbuja-' + nuevoDia);
            if (burbujaActiva) {
                burbujaActiva.classList.add('activa');
                // Auto-scroll para centrar la burbuja activa en la pantalla
                burbujaActiva.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }

            const tarjeta = document.getElementById('tarjeta-principal');
            
            // Calcular dirección de la animación ('timer' está a la izquierda de 'lunes')
            const ordenCarrusel = ['timer', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado', 'domingo'];
            const indiceActual = ordenCarrusel.indexOf(diaActualRenderizado);
            const indiceNuevo = ordenCarrusel.indexOf(nuevoDia);
            
            // Si el nuevo elemento está a la derecha, sale a la izq y entra por der (y viceversa)
            const claseSalida = indiceNuevo > indiceActual ? 'saliendo-izq' : 'saliendo-der';
            const claseEntrada = indiceNuevo > indiceActual ? 'entrando-der' : 'entrando-izq';

            // 1. Ejecutamos la salida de la tarjeta actual
            tarjeta.classList.add(claseSalida);

            // 2. Esperamos a que termine de salir (300ms) para intercambiar la vista
            setTimeout(() => {
                const divDatosReales = document.getElementById('datos-reales');
                const divConsolaTimer = document.getElementById('consola-timer');

                if (nuevoDia === 'timer') {
                    document.getElementById('dia-titulo').innerText = "⏱️ Descanso y Series";
                    divDatosReales.style.display = 'none';
                    divConsolaTimer.style.display = 'block';
                } else {
                    divConsolaTimer.style.display = 'none';
                    divDatosReales.style.display = 'block';
                    document.getElementById('dia-titulo').innerText = "Rutina del " + nuevoDia;
                    if(planSemanal[nuevoDia]) {
                        document.getElementById('texto-entrenamiento').innerText = planSemanal[nuevoDia].entrenamiento;
                        document.getElementById('texto-dieta').innerText = planSemanal[nuevoDia].dieta;
                    } else {
                        document.getElementById('texto-entrenamiento').innerText = "Día libre o sin datos.";
                        document.getElementById('texto-dieta').innerText = "Día libre o sin datos.";
                    }
                }

                // 3. Preparamos la tarjeta en su punto de inicio opuesto para entrar
                tarjeta.classList.remove(claseSalida);
                tarjeta.classList.add(claseEntrada);

                // 4. Forzamos un reflow del navegador (obligatorio para que la animación de entrada funcione)
                void tarjeta.offsetWidth;

                // 5. Quitamos la clase de entrada para que la tarjeta vuelva a su posición original visible
                tarjeta.classList.remove(claseEntrada);
                
                diaActualRenderizado = nuevoDia;
            }, 300); // 300ms coincide con la transición CSS
        }

        // Esta función se llama inicialmente para renderizar sin animaciones al cargar la página
        function mostrarDia(dia) {
            inicializarCarrusel();
            
            const burbujaHoy = document.getElementById('burbuja-' + dia);
            if (burbujaHoy) {
                burbujaHoy.classList.add('activa');
                // Darle un milisegundo al navegador para pintar antes de hacer el scroll
                setTimeout(() => burbujaHoy.scrollIntoView({ inline: 'center' }), 100);
            }

            document.getElementById('dia-titulo').innerText = "Rutina del " + dia;
            if(planSemanal[dia]) {
                document.getElementById('texto-entrenamiento').innerText = planSemanal[dia].entrenamiento;
                document.getElementById('texto-dieta').innerText = planSemanal[dia].dieta;
            }
        }

        // --- 4. LÓGICA DEL CHAT, MEMORIA 4 HS Y TEMPORIZADOR ---
        let historialChat = []; // Memoria temporal de la conversación actual
        let burbujasGuardadas = []; // Globos dibujados en pantalla (duran 4 horas)
        let restaurandoMemoria = false;
        const TIEMPO_EXPIRACION_MS = 4 * 60 * 60 * 1000; // 4 horas exactas

        let altoSinTeclado = window.innerHeight; // Guarda el alto real al abrir la app (con teclado cerrado)
        window.addEventListener('resize', () => {
            if (window.innerHeight > altoSinTeclado) altoSinTeclado = window.innerHeight;
        });

        // Variables del Temporizador y Series
        let finTimer = 0;
        let serieActual = 0;
        let intervaloTimer = null;
        let audioCtx = null;

        function desbloquearAudio() {
            try {
                if (!audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) audioCtx = new AudioContextClass();
                }
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) {}
        }

        function sonarAlarmaGym() {
            // 1. Vibración física (en dispositivos compatibles como Android)
            if (navigator.vibrate) navigator.vibrate([300, 120, 300, 120, 450]);
            // 2. Triple pitido deportivo ("Beep-Beep-Beep") para iPhone y Apple Watch
            try {
                desbloquearAudio();
                if (!audioCtx) return;
                [0, 0.22, 0.44].forEach(delay => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime + delay);
                    gain.gain.setValueAtTime(0.35, audioCtx.currentTime + delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + 0.16);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + delay);
                    osc.stop(audioCtx.currentTime + delay + 0.17);
                });
            } catch (e) {}
        }

        function guardarEstadoTimer() {
            localStorage.setItem('gymtrack_timer_v1', JSON.stringify({
                finTimer: finTimer,
                serieActual: serieActual,
                timestamp: Date.now()
            }));
        }

        function iniciarTimer(segundos) {
            desbloquearAudio();
            if (navigator.vibrate) navigator.vibrate(40);
            finTimer = Date.now() + (segundos * 1000);
            serieActual++;
            document.getElementById('num-serie').innerText = serieActual;
            document.getElementById('tarjeta-principal').classList.remove('alerta-neon');
            guardarEstadoTimer();
            actualizarRelojEnVivo();
            if (intervaloTimer) clearInterval(intervaloTimer);
            intervaloTimer = setInterval(actualizarRelojEnVivo, 250);
        }

        function detenerTimer() {
            if (navigator.vibrate) navigator.vibrate(30);
            finTimer = 0;
            if (intervaloTimer) clearInterval(intervaloTimer);
            document.getElementById('reloj-display').innerText = "00:00";
            document.getElementById('tarjeta-principal').classList.remove('alerta-neon');
            const bTimer = document.getElementById('burbuja-timer');
            if (bTimer) bTimer.innerText = '⏱️';
            guardarEstadoTimer();
        }

        function reiniciarSeries() {
            if (navigator.vibrate) navigator.vibrate(50);
            serieActual = 0;
            document.getElementById('num-serie').innerText = "0";
            guardarEstadoTimer();
        }

        function actualizarRelojEnVivo() {
            const bTimer = document.getElementById('burbuja-timer');
            const display = document.getElementById('reloj-display');
            if (!finTimer) return;

            const restantes = Math.ceil((finTimer - Date.now()) / 1000);
            if (restantes > 0) {
                const min = String(Math.floor(restantes / 60)).padStart(2, '0');
                const seg = String(restantes % 60).padStart(2, '0');
                const textoHora = `${min}:${seg}`;
                if (display) display.innerText = textoHora;
                if (bTimer) bTimer.innerText = `⏱️ ${min}:${seg}`;
            } else {
                // ¡Llegó a 00:00!
                finTimer = 0;
                if (intervaloTimer) clearInterval(intervaloTimer);
                if (display) display.innerText = "¡A TIRAR! 🔥";
                if (bTimer) bTimer.innerText = "⏱️ ¡YA!";
                guardarEstadoTimer();
                sonarAlarmaGym();
                const tarjeta = document.getElementById('tarjeta-principal');
                tarjeta.classList.add('alerta-neon');
                setTimeout(() => {
                    tarjeta.classList.remove('alerta-neon');
                    if (bTimer && !finTimer) bTimer.innerText = '⏱️';
                }, 4000);
            }
        }

        function guardarSesionChat() {
            localStorage.setItem('gymtrack_chat_v1', JSON.stringify({
                timestamp: Date.now(),
                historial: historialChat,
                burbujas: burbujasGuardadas
            }));
        }

        function limpiarChatCompleto() {
            historialChat = [];
            burbujasGuardadas = [];
            localStorage.removeItem('gymtrack_chat_v1');
            chatMensajes.innerHTML = '';
            restaurandoMemoria = true;
            agregarBurbuja("🧹 **Chat limpio.** Memoria de la sesión reiniciada desde cero.", 'ia');
            restaurandoMemoria = false;
        }

        function restaurarSesionYTimer() {
            // 1. Restaurar chat si tiene menos de 4 horas
            try {
                const chatGuardado = JSON.parse(localStorage.getItem('gymtrack_chat_v1') || 'null');
                if (chatGuardado && (Date.now() - chatGuardado.timestamp) < TIEMPO_EXPIRACION_MS) {
                    historialChat = chatGuardado.historial || [];
                    burbujasGuardadas = chatGuardado.burbujas || [];
                    if (burbujasGuardadas.length > 0) {
                        chatMensajes.innerHTML = '';
                        restaurandoMemoria = true;
                        burbujasGuardadas.forEach(b => agregarBurbuja(b.texto, b.remitente));
                        restaurandoMemoria = false;
                    }
                } else {
                    localStorage.removeItem('gymtrack_chat_v1');
                }
            } catch (e) {}

            // 2. Restaurar Temporizador y Series si tienen menos de 4 horas
            try {
                const timerGuardado = JSON.parse(localStorage.getItem('gymtrack_timer_v1') || 'null');
                if (timerGuardado && (Date.now() - timerGuardado.timestamp) < TIEMPO_EXPIRACION_MS) {
                    serieActual = timerGuardado.serieActual || 0;
                    document.getElementById('num-serie').innerText = serieActual;
                    if (timerGuardado.finTimer && timerGuardado.finTimer > Date.now()) {
                        finTimer = timerGuardado.finTimer;
                        actualizarRelojEnVivo();
                        intervaloTimer = setInterval(actualizarRelojEnVivo, 250);
                    }
                } else {
                    localStorage.removeItem('gymtrack_timer_v1');
                }
            } catch (e) {}
        }
        const chatSheet = document.getElementById('chat-sheet');
        const overlay = document.getElementById('overlay');
        const chatMensajes = document.getElementById('chat-mensajes');
        const chatInput = document.getElementById('chat-input-text'); // Necesitamos agregarle este ID al input HTML

        function abrirChat() {
            chatSheet.classList.add('open');
            overlay.classList.add('active');
            if (navigator.vibrate) navigator.vibrate(50); // Vibración sutil
        }

        function cerrarChat() {
            chatSheet.classList.remove('open');
            overlay.classList.remove('active');
        }

        // Esta función empaqueta tu pregunta junto con tus datos del día
        async function enviarMensaje() {
            const pregunta = chatInput.value.trim();
            if (!pregunta) return;

            // Detector inteligente para limpiar el chat sin confundirse con preguntas de comida/rutina
            const comandoLimpio = pregunta.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[.,!?¿¡]/g, "").trim();
            const pideBorrarChat = /^(limpiar|borrar|eliminar|reiniciar|vaciar|clear|reset)$/.test(comandoLimpio) ||
                                   /^(limpiar|borrar|eliminar|reiniciar|vaciar)\s+(el\s+|la\s+|los\s+|todo\s+el\s+)?(chat|historial|mensajes|conversacion|sesion|memoria)$/.test(comandoLimpio);
            if (pideBorrarChat) {
                chatInput.value = '';
                limpiarChatCompleto();
                return;
            }

            // 1. Mostrar tu mensaje en la pantalla
            agregarBurbuja(pregunta, 'usuario');
            chatInput.value = ''; // Limpiar la barra

            // 2. Detectar si estás desde el Apple Watch (Ancho <= 330px Y Alto sin teclado <= 400px)
            const esReloj = window.innerWidth <= 330 && altoSinTeclado <= 400;
            const infoDispositivo = {
                tipo: esReloj ? "Apple Watch" : "Celular / PC",
                interfaz: esReloj ? "pantalla pequeña (modo ultra compacto)" : "pantalla estándar",
                ancho_px: window.innerWidth,
                alto_px: altoSinTeclado
            };

            // 3. Empaquetar el "Expediente Secreto" comprimido para ahorrar un 25% de tokens
            const expedienteSecreto = `PERFIL:${JSON.stringify(perfilDatos)}\nPLAN_7_DIAS:${JSON.stringify(planSemanal)}\nDIA_EN_PANTALLA:${diaActualRenderizado}`;
            
            // Este objeto viaja a Google Apps Script (ahora incluye la memoria temporal)
            const paqueteParaIA = {
                contexto: expedienteSecreto,
                dispositivo: infoDispositivo,
                historial: historialChat,
                mensaje: pregunta
            };

            // 3. Mostrar estado "Escribiendo..."
            const idTyping = agregarBurbuja("Analizando tus macros...", 'ia', true);

            // 4. Conexión Real con Gemini a través de Google Apps Script
            try {
                const respuesta = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(paqueteParaIA) // Enviamos pregunta + datos biométricos
                    // NOTA: No usamos 'headers: { "Content-Type": "application/json" }' 
                    // porque Google Apps Script requiere que las peticiones POST desde el navegador 
                    // se envíen como texto plano para evitar el bloqueo estricto de CORS.
                });
                
                const datosRespuesta = await respuesta.json();
                
                // Borramos el mensaje de "Escribiendo..."
                document.getElementById(idTyping).remove();
                
                // Dibujamos la respuesta real de Gemini
                agregarBurbuja(datosRespuesta.respuesta, 'ia');

                // Si hubo un error de API/cuota, devolvemos tu pregunta a la barra para no perderla
                if (datosRespuesta.respuesta.startsWith("Error")) {
                    chatInput.value = pregunta;
                } else {
                    // 1. Guardamos el 100% de tu pregunta intacta
                    historialChat.push({ rol: "Usuario", texto: pregunta });
                    
                    // 2. Si la respuesta de la IA fue gigante (>350 letras), la recortamos en la memoria para ahorrar tokens
                    const respuestaParaMemoria = datosRespuesta.respuesta.length > 350 
                        ? datosRespuesta.respuesta.substring(0, 350) + "... [respuesta extensa resumida en memoria]" 
                        : datosRespuesta.respuesta;
                    historialChat.push({ rol: "GymTrack", texto: respuestaParaMemoria });

                    // 3. Ventana inteligente: mantenemos solo los últimos 12 mensajes (6 idas y vueltas completas)
                    if (historialChat.length > 12) {
                        historialChat = historialChat.slice(-12);
                    }
                }
                
                // Vibración de victoria cuando llega la respuesta
                if (navigator.vibrate) navigator.vibrate([30, 50, 30]); 
                
            } catch (error) {
                console.error("Error en el chat:", error);
                document.getElementById(idTyping).remove();
                // BLINDAJE WI-FI: Devolvemos el texto a la caja para que no tengas que volver a escribirlo ni dictarlo
                chatInput.value = pregunta;
                agregarBurbuja("⚠️ Se cortó la señal. Tu mensaje quedó guardado en la barra de abajo para que le des enviar de nuevo apenas vuelva el Wi-Fi.", 'ia');
            }
        }

        // Función para dibujar los mensajes en el chat
        function agregarBurbuja(texto, remitente, esTyping = false) {
            const id = 'msg-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'burbuja-chat';
            div.style.margin = "10px 0";
            div.style.padding = "12px 16px";
            div.style.borderRadius = "16px";
            div.style.maxWidth = "85%";
            div.style.lineHeight = "1.4";
            div.style.fontSize = "0.95rem";
            div.style.flexShrink = "0"; // Prohibido aplastar el globo verticalmente
            div.style.height = "auto";
            div.style.overflowWrap = "break-word"; // Corta palabras o links largos dentro del globo
            div.style.wordBreak = "break-word";
            div.style.boxSizing = "border-box";
            
            if (remitente === 'usuario') {
                div.style.background = "var(--neon-cyan)";
                div.style.color = "#000";
                div.style.marginLeft = "auto";
                div.style.borderBottomRightRadius = "4px";
            } else {
                div.style.background = "#2a2a2a";
                div.style.color = "#fff";
                div.style.marginRight = "auto";
                div.style.borderBottomLeftRadius = "4px";
                if (esTyping) div.style.fontStyle = "italic";
            }
            
            if (remitente === 'ia' && !esTyping) {
                // 1. Quitar los signos # sueltos al inicio de los renglones
                let textoFormateado = texto.replace(/^#+\s*/gm, '');
                // 2. Pintar todo lo que esté entre **dobles asteriscos** en color Cian Neón brillante
                textoFormateado = textoFormateado.replace(/\*\*(.*?)\*\*/g, '<strong style="color: var(--neon-cyan); text-shadow: 0 0 6px rgba(0,255,204,0.35);">$1</strong>');
                // 3. Transformar los "Enters" en saltos de línea reales (<br>)
                div.innerHTML = textoFormateado.replace(/\n/g, '<br>');
            } else {
                div.innerText = texto;
            }
            chatMensajes.appendChild(div);
            
            // Guardar el globo en la memoria de 4 horas (salvo que sea el "Escribiendo..." o un error de red)
            if (!esTyping && !restaurandoMemoria && !texto.startsWith("Error") && !texto.startsWith("⚠️ Se cortó")) {
                burbujasGuardadas.push({ texto: texto, remitente: remitente });
                if (burbujasGuardadas.length > 24) burbujasGuardadas = burbujasGuardadas.slice(-24);
                guardarSesionChat();
            }

            // Hacer scroll automático hacia abajo
            chatMensajes.scrollTop = chatMensajes.scrollHeight;
            return id;
        }

        // Ejecutar carga y restaurar memoria de 4 horas al abrir la app
        restaurarSesionYTimer();
        cargarDatos();
    </script>
