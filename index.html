<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym & Dieta</title>
    <style>
        /* Variables de color premium */
        :root {
            --bg-color: #0d0d0d;
            --glass-bg: rgba(30, 30, 30, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-cyan: #00ffcc;
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            /* Evita el scroll y rebotes raros en iOS/Android */
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Encabezado fijo con efecto de vidrio esmerilado */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 60px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        header h1 {
            font-size: 1.2rem;
            margin: 0;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }

        /* Carrusel superior de días */
        #carrusel-dias {
            position: fixed;
            top: 60px;
            width: 100%;
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding: 15px 20px;
            background: var(--bg-color);
            z-index: 90;
            box-sizing: border-box;
            /* Ocultar barra de scroll en distintos navegadores */
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        #carrusel-dias::-webkit-scrollbar {
            display: none;
        }

        .burbuja-dia {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: capitalize;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .burbuja-dia.activa {
            background: var(--neon-cyan);
            color: #000;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }

        /* Burbuja del temporizador clavada fija a la izquierda de Lunes */
        #burbuja-timer {
            position: sticky;
            left: 0;
            z-index: 10;
            flex-shrink: 0;
            background: #181818;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: -20px 0 0 var(--bg-color), 8px 0 12px var(--bg-color);
        }
        #burbuja-timer.activa {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: -20px 0 0 var(--bg-color), 8px 0 12px var(--bg-color), 0 0 10px rgba(0, 255, 204, 0.5);
        }

        /* Consola del Temporizador y Contador de Series */
        .timer-reloj {
            font-size: 2.8rem;
            font-weight: 800;
            text-align: center;
            color: var(--neon-cyan);
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.35);
            margin: 6px 0 10px 0;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
        }
        .serie-badge {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid var(--neon-cyan);
            color: #fff;
            border-radius: 12px;
            padding: 10px 12px;
            text-align: center;
            font-weight: bold;
            font-size: 1.05rem;
            margin-bottom: 14px;
            cursor: pointer;
            user-select: none;
        }
        .serie-badge:active {
            transform: scale(0.97);
            background: rgba(0, 255, 204, 0.25);
        }
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .timer-btn {
            background: #252525;
            border: 1px solid var(--glass-border);
            color: #fff;
            border-radius: 12px;
            padding: 12px 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .timer-btn:active {
            background: var(--neon-cyan);
            color: #000;
        }
        .timer-btn.stop {
            background: rgba(255, 70, 70, 0.15);
            border-color: rgba(255, 70, 70, 0.4);
            color: #ff6b6b;
        }
        @keyframes pulsoNeon {
            0%, 100% { box-shadow: 0 0 6px rgba(0,255,204,0.3), inset 0 0 6px rgba(0,255,204,0.2); border-color: var(--glass-border); }
            50% { box-shadow: 0 0 20px rgba(0,255,204,1), inset 0 0 18px rgba(0,255,204,0.8); border-color: var(--neon-cyan); }
        }
        .alerta-neon {
            animation: pulsoNeon 0.55s infinite;
        }

        /* Contenedor principal ajustado para dar espacio al carrusel */
        main {
            padding: 130px 20px 90px 20px;
            overflow-x: hidden; /* Clave para que la animación no rompa el ancho de pantalla */
        }

        /* Clase para la animación fluida de las tarjetas */
        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        /* Estados de animación para la tarjeta */
        .card.saliendo-izq { transform: translateX(-100%); opacity: 0; }
        .card.saliendo-der { transform: translateX(100%); opacity: 0; }
        .card.entrando-izq { transform: translateX(-100%); opacity: 0; }
        .card.entrando-der { transform: translateX(100%); opacity: 0; }

        /* Tarjetas de contenido */
        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            margin-top: 0;
            color: var(--neon-cyan);
            font-size: 1.1rem;
            text-transform: uppercase;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
        }

        .seccion { margin-top: 15px; }
        
        .etiqueta {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        /* Skeleton Loaders (Efecto animado mientras baja los datos de Google Sheets) */
        .skeleton {
            background: linear-gradient(90deg, #222 25%, #333 50%, #222 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 4px;
            height: 20px;
            margin-bottom: 10px;
        }
        .skeleton.title { width: 50%; height: 24px; }
        .skeleton.text { width: 100%; height: 60px; }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Barra de navegación inferior (Bottom Nav) */
        nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 70px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            transition: color 0.3s ease;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--neon-cyan);
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            fill: currentColor;
        }

        /* Bottom Sheet (Panel flotante del Chat) */
        #chat-sheet {
            position: fixed;
            bottom: -100%; /* Oculto por defecto abajo de la pantalla */
            left: 0;
            width: 100%;
            height: 75vh;
            background: #1a1a1a;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -5px 40px rgba(0,0,0,0.6);
            z-index: 200;
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
        }

        #chat-sheet.open {
            bottom: 0;
        }

        .chat-header {
            padding: 6px 18px;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--neon-cyan);
            font-size: 1.8rem;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        /* En iPhone/PC: inmoviliza la pantalla de atrás mientras el chat está abierto */
        body.chat-abierto {
            overflow: hidden;
        }

        .chat-body {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            outline: none !important;
        }

        .chat-input-area {
            padding: 15px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 10px;
            background: #121212;
        }

        .chat-input-area input {
            flex-grow: 1;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 20px;
            padding: 12px 15px;
            outline: none;
            font-family: inherit;
            font-size: 0.95rem; /* Mismo tamaño de letra que los globos de conversación */
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }

        /* Icono limpio para copiar texto dentro de cada globo (estilo chat original) */
        .contenedor-copiar {
            display: flex;
            justify-content: flex-end;
            margin-top: 4px;
        }
        .btn-copiar-globo {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.65);
            padding: 4px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: color 0.2s ease, transform 0.15s ease;
        }
        .btn-copiar-globo svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .btn-copiar-globo.usuario-btn {
            color: rgba(0, 0, 0, 0.6);
        }
        .btn-copiar-globo:active {
            transform: scale(0.88);
            color: var(--neon-cyan);
        }
        .btn-copiar-globo.usuario-btn:active {
            color: #000;
        }

        .chat-input-area input:focus {
            border-color: var(--neon-cyan);
        }

        .chat-input-area button {
            background: var(--neon-cyan);
            color: #000;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Fondo oscuro al abrir el chat */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 150;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #overlay.active { display: block; opacity: 1; }

        /* --- MODO APPLE WATCH SERIES 7 (Ancho <= 330px y Alto <= 520px) --- */
        @media (max-width: 330px) and (max-height: 520px) {
            /* Desplazamiento 100% nativo para activar la ruedita del reloj y esconder la barra del enlace */
            html, body {
                height: auto;
                overflow-x: hidden;
                overflow-y: visible;
            }
            /* Apagar desenfoque pesado en el reloj para que nunca se trabe la pantalla en negro al bajar la muñeca */
            header, nav, #overlay {
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
            }
            /* Hacer que GYMTRACK y las burbujas suban al desplazar para ver el temporizador completo */
            header {
                position: relative;
                top: auto;
                height: 36px;
                background: #141414;
            }
            header h1 {
                font-size: 1.15rem;
            }
            #carrusel-dias {
                position: relative;
                top: auto;
                padding: 8px 12px;
                gap: 10px;
            }
            /* Burbujas de los días más grandes para compensar el zoom del reloj */
            .burbuja-dia {
                padding: 11px 18px;
                font-size: 1.1rem;
                border-radius: 22px;
            }
            main {
                padding: 6px 13px 10px 13px;
            }
            .card {
                padding: 14px 12px;
                border-radius: 14px;
                margin-bottom: 12px;
            }
            .card h2 {
                font-size: 1.15rem;
                padding-bottom: 8px;
            }
            #texto-entrenamiento, #texto-dieta {
                font-size: 1.05rem;
                line-height: 1.45;
            }
            /* Barra inferior suelta al final: solo aparece cuando llegás al límite de abajo */
            nav {
                position: relative;
                bottom: auto;
                height: 60px;
                background: #141414;
                margin-top: 4px;
            }
            .nav-item {
                font-size: 0.85rem;
                padding: 6px 10px;
            }
            .nav-item svg {
                width: 24px;
                height: 24px;
                margin-bottom: 3px;
            }
            /* En el reloj: al abrir el chat se apaga el fondo y la ruedita mueve directo los mensajes */
            body.chat-abierto {
                overflow: visible !important;
            }
            body.chat-abierto header,
            body.chat-abierto #carrusel-dias,
            body.chat-abierto main,
            body.chat-abierto nav,
            body.chat-abierto #overlay {
                display: none !important;
            }
            #chat-sheet {
                display: none;
            }
            #chat-sheet.open {
                display: flex;
                position: relative;
                top: auto;
                bottom: auto;
                width: 100%;
                height: auto;
                min-height: 100vh;
                border-radius: 0;
                box-sizing: border-box;
            }
            .chat-header {
                position: sticky;
                top: 0;
                z-index: 20;
                background: #1a1a1a;
                padding: 2px 14px;
                min-height: 30px;
                font-size: 1.05rem;
                box-sizing: border-box;
            }
            .close-btn {
                font-size: 2.2rem;
                line-height: 0.85;
                padding: 0 10px;
            }
            .chat-body {
                padding: 10px 8px;
                box-sizing: border-box;
                overflow-y: visible;
                height: auto;
            }
            .chat-input-area {
                position: sticky;
                bottom: 0;
                z-index: 20;
            }
            .burbuja-chat {
                max-width: 94% !important;
                padding: 12px 14px !important;
                font-size: 1.05rem !important;
                margin: 8px 0 !important;
                box-sizing: border-box;
            }
            /* Margen lateral e inferior extra para esquivar la curva física del reloj */
            .chat-input-area {
                width: 100%;
                box-sizing: border-box;
                padding: 10px 14px 16px 14px;
                gap: 8px;
                align-items: center;
            }
            /* min-width: 0 evita que la caja de texto empuje al botón fuera de pantalla */
            .chat-input-area input {
                min-width: 0;
                width: 100%;
                box-sizing: border-box;
                padding: 12px 14px;
                font-size: 1.05rem;
            }
            .chat-input-area button {
                width: 48px;
                height: 48px;
                flex-shrink: 0;
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header Superior -->
    <header>
        <h1><span style="color:var(--text-main);">GYM</span><span style="color:var(--neon-cyan);">TRACK</span></h1>
    </header>

    <!-- Carrusel de días -->
    <div id="carrusel-dias">
        <!-- Las burbujas se inyectarán acá con JS -->
    </div>

    <!-- Contenido Principal -->
    <main id="pantalla-plan">
        <div class="card" id="tarjeta-principal">
            <h2 id="dia-titulo">Cargando Hoy...</h2>
            
            <!-- Skeleton Loaders -->
            <div id="loaders">
                <div class="skeleton title"></div>
                <div class="skeleton text"></div>
                <br>
                <div class="skeleton title"></div>
                <div class="skeleton text"></div>
            </div>

            <!-- Contenedor de datos (Oculto hasta la Fase 4) -->
            <div id="datos-reales" style="display: none;">
                <div class="seccion">
                    <div class="etiqueta">🏋️ Entrenamiento</div>
                    <div id="texto-entrenamiento"></div>
                </div>
                <div class="seccion">
                    <div class="etiqueta">🥩 Nutrición</div>
                    <div id="texto-dieta"></div>
                </div>
            </div>

            <!-- Consola del Temporizador y Series (Oculta hasta tocar la burbuja ⏱️) -->
            <div id="consola-timer" style="display: none;">
                <div class="timer-reloj" id="reloj-display">00:00</div>
                <div class="serie-badge" onclick="reiniciarSeries()">
                    🔥 Serie actual: <span id="num-serie" style="color: var(--neon-cyan); font-size: 1.2rem;">1</span>
                    <div style="font-size: 0.72rem; color: var(--text-muted); font-weight: normal; margin-top: 3px;">
                        (Tocá acá al cambiar de ejercicio para volver a 1)
                    </div>
                </div>
                <div class="timer-grid">
                    <button class="timer-btn" onclick="iniciarTimer(60)">60s</button>
                    <button class="timer-btn" onclick="iniciarTimer(90)">90s</button>
                    <button class="timer-btn" onclick="iniciarTimer(120)">2m</button>
                    <button class="timer-btn" onclick="iniciarTimer(180)">3m</button>
                    <button class="timer-btn" onclick="iniciarTimer(240)">4m</button>
                    <button class="timer-btn stop" onclick="detenerTimer()">⏹️ 00:00</button>
                </div>
            </div>
        </div>
        <!-- Tarjeta de Perfil (Oculta por defecto) -->
        <div class="card" id="tarjeta-perfil" style="display: none;">
            <h2>👤 Mi Perfil Biométrico</h2>
            <div id="perfil-datos-reales">
                <!-- Los datos se inyectarán acá con JS -->
            </div>
        </div>
    </main>

    <!-- Barra de Navegación Inferior -->
    <nav>
        <div class="nav-item active" id="btn-nav-hoy" onclick="cambiarVista('hoy')">
            <!-- Icono de Calendario/Plan -->
            <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10z"/></svg>
            Hoy
        </div>
        <div class="nav-item" id="btn-nav-perfil" onclick="cambiarVista('perfil')">
            <!-- Icono de Usuario/Perfil -->
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Perfil
        </div>
        <div class="nav-item" onclick="abrirChat()">
            <!-- Icono de Chat/IA -->
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/></svg>
            Asistente
        </div>
    </nav>

    <!-- Fondo desenfocado para el chat -->
    <div id="overlay" onclick="cerrarChat()"></div>

    <!-- Panel de Chat Desplegable (Bottom Sheet) -->
    <div id="chat-sheet">
        <div class="chat-header">
            <span>Asistente IA</span>
            <button class="close-btn" onclick="cerrarChat()">&times;</button>
        </div>
        <div class="chat-body" id="chat-mensajes">
            <p style="color: var(--text-muted); font-size: 0.9rem; text-align: center; margin-top: 20px;">
                Conectando con Gemini...<br>Conozco tu rutina y medidas de hoy. ¿Qué necesitas?
            </p>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input-text" placeholder="Consultar reemplazo de comida..." onkeypress="if(event.key === 'Enter') enviarMensaje()">
            <button onclick="enviarMensaje()">➤</button>
        </div>
    </div>

    <!-- Funciones base para probar la animación del Chat -->
    <script>
        // --- 1. CONFIGURACIÓN ---
        // ¡IMPORTANTE! Pegá acá adentro de las comillas la URL que te dio Google Apps Script en la Fase 2
        const API_URL = 'https://script.google.com/macros/s/AKfycby6lGq8fM58ba27w-irwB0aZQVzTELOMuAfoS6gKRDWGjz9l8ZffS2X9-FH-bZEmyGh/exec'; 
        
        let planSemanal = {};
        let perfilDatos = {}; // Nueva variable para guardar el perfil
        const diasSemana = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];
        const hoy = diasSemana[new Date().getDay()];

        // --- 2. LÓGICA DE CARGA DE DATOS DUAL ---
        async function cargarDatos() {
            try {
                // Llama a tu Google Sheet (ahora trae el paquete maestro)
                const respuesta = await fetch(API_URL);
                const datosMaestros = await respuesta.json();
                
                // Separamos los datos
                planSemanal = datosMaestros.plan;
                perfilDatos = datosMaestros.perfil;
                
                // Oculta los loaders animados y muestra los datos reales
                document.getElementById('loaders').style.display = 'none';
                document.getElementById('datos-reales').style.display = 'block';
                
                // Renderizar los datos del perfil en el HTML
                renderizarPerfil();
                
                // Muestra la rutina de hoy por defecto
                mostrarDia(hoy);
            } catch (error) {
                console.error("Error cargando los datos:", error);
                document.getElementById('dia-titulo').innerText = "Error de conexión ⚠️";
                document.getElementById('loaders').style.display = 'none';
            }
        }

        // Función para inyectar las métricas de perfil en la tarjeta oculta
        function renderizarPerfil() {

        // Función visual para alternar entre "Hoy" y "Perfil"
        function cambiarVista(vista) {

        // --- 3. ANIMACIONES Y RENDERIZADO DE LA INTERFAZ ---
        let diaActualRenderizado = hoy;

        function inicializarCarrusel() {
            const contenedorCarrusel = document.getElementById('carrusel-dias');
            contenedorCarrusel.innerHTML = '';

            // 1. Crear primero la burbuja fija del Temporizador a la izquierda de Lunes
            const burbujaTimer = document.createElement('div');
            burbujaTimer.className = 'burbuja-dia';
            burbujaTimer.id = 'burbuja-timer';
            burbujaTimer.innerText = '⏱️';
            burbujaTimer.onclick = () => cambiarDiaConAnimacion('timer');
            contenedorCarrusel.appendChild(burbujaTimer);
            
            // 2. Reordenamos el array para que empiece el lunes
            const diasOrdenados = ['lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado', 'domingo'];
            
            diasOrdenados.forEach(dia => {
                const burbuja = document.createElement('div');
                burbuja.className = 'burbuja-dia';
                burbuja.id = 'burbuja-' + dia;
                burbuja.innerText = dia;
                
                burbuja.onclick = () => cambiarDiaConAnimacion(dia);
                contenedorCarrusel.appendChild(burbuja);
            });
        }

        function cambiarDiaConAnimacion(nuevoDia) {
            if (nuevoDia === diaActualRenderizado) return; // Si tocas el mismo día, no hace nada

            // Retroalimentación háptica sutil
            if (navigator.vibrate) navigator.vibrate(30);

            // Actualizar estilo visual de las burbujas
            document.querySelectorAll('.burbuja-dia').forEach(b => b.classList.remove('activa'));
            const burbujaActiva = document.getElementById('burbuja-' + nuevoDia);
            if (burbujaActiva) {
                burbujaActiva.classList.add('activa');
                // Auto-scroll para centrar la burbuja activa en la pantalla
                burbujaActiva.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }

            const tarjeta = document.getElementById('tarjeta-principal');
            
            // Calcular dirección de la animación ('timer' está a la izquierda de 'lunes')
            const ordenCarrusel = ['timer', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado', 'domingo'];
            const indiceActual = ordenCarrusel.indexOf(diaActualRenderizado);
            const indiceNuevo = ordenCarrusel.indexOf(nuevoDia);
            
            // Si el nuevo elemento está a la derecha, sale a la izq y entra por der (y viceversa)
            const claseSalida = indiceNuevo > indiceActual ? 'saliendo-izq' : 'saliendo-der';
            const claseEntrada = indiceNuevo > indiceActual ? 'entrando-der' : 'entrando-izq';

            // 1. Ejecutamos la salida de la tarjeta actual
            tarjeta.classList.add(claseSalida);

            // 2. Esperamos a que termine de salir (300ms) para intercambiar la vista
            setTimeout(() => {
                const divDatosReales = document.getElementById('datos-reales');
                const divConsolaTimer = document.getElementById('consola-timer');

                if (nuevoDia === 'timer') {
                    document.getElementById('dia-titulo').innerText = "⏱️ Descanso y Series";
                    divDatosReales.style.display = 'none';
                    divConsolaTimer.style.display = 'block';
                } else {
                    divConsolaTimer.style.display = 'none';
                    divDatosReales.style.display = 'block';
                    document.getElementById('dia-titulo').innerText = "Rutina del " + nuevoDia;
                    if(planSemanal[nuevoDia]) {
                        document.getElementById('texto-entrenamiento').innerText = planSemanal[nuevoDia].entrenamiento;
                        document.getElementById('texto-dieta').innerText = planSemanal[nuevoDia].dieta;
                    } else {
                        document.getElementById('texto-entrenamiento').innerText = "Día libre o sin datos.";
                        document.getElementById('texto-dieta').innerText = "Día libre o sin datos.";
                    }
                }

                // 3. Preparamos la tarjeta en su punto de inicio opuesto para entrar
                tarjeta.classList.remove(claseSalida);
                tarjeta.classList.add(claseEntrada);

                // 4. Forzamos un reflow del navegador (obligatorio para que la animación de entrada funcione)
                void tarjeta.offsetWidth;

                // 5. Quitamos la clase de entrada para que la tarjeta vuelva a su posición original visible
                tarjeta.classList.remove(claseEntrada);
                
                diaActualRenderizado = nuevoDia;
            }, 300); // 300ms coincide con la transición CSS
        }

        // Esta función se llama inicialmente para renderizar sin animaciones al cargar la página
        function mostrarDia(dia) {
            inicializarCarrusel();
            
            const burbujaHoy = document.getElementById('burbuja-' + dia);
            if (burbujaHoy) {
                burbujaHoy.classList.add('activa');

            if(planSemanal[dia]) {

                document.getElementById('texto-dieta').innerText = planSemanal[dia].dieta;
            }
        }

        // --- 4. LÓGICA DEL CHAT, MEMORIA 4 HS Y TEMPORIZADOR ---
        let historialChat = []; // Memoria temporal de la conversación actual
        let burbujasGuardadas = []; // Globos dibujados en pantalla (duran 4 horas)
        let restaurandoMemoria = false;
        const TIEMPO_EXPIRACION_MS = 4 * 60 * 60 * 1000; // 4 horas exactas

        let altoSinTeclado = window.innerHeight; // Guarda el alto real al abrir la app (con teclado cerrado)
        window.addEventListener('resize', () => {
            if (window.innerHeight > altoSinTeclado) altoSinTeclado = window.innerHeight;
        });

        // Variables del Temporizador y Series (arranca siempre en Serie 1)
        let finTimer = 0;
        let serieActual = 1;
        let intervaloTimer = null;
        let audioCtx = null;
        let nodoSilencioso = null;
        let wakeLockPantalla = null;

        async function mantenerPantallaEncendida(activar) {
            try {
                if (activar && 'wakeLock' in navigator && !wakeLockPantalla) {
                    wakeLockPantalla = await navigator.wakeLock.request('screen');
                } else if (!activar && wakeLockPantalla) {
                    await wakeLockPantalla.release();
                    wakeLockPantalla = null;
                }
            } catch (e) {}
        }

        // Despertar instantáneo del reloj al girar la muñeca o tocar la pantalla
        ['visibilitychange', 'focus', 'pageshow', 'touchstart'].forEach(evento => {
            window.addEventListener(evento, () => {
                if (finTimer > 0) {
                    actualizarRelojEnVivo();
                    if (!intervaloTimer) intervaloTimer = setInterval(actualizarRelojEnVivo, 250);
                    mantenerPantallaEncendida(true);
                }
            }, { passive: true });
        });

        function desbloquearAudio(hacerPipInicial = false) {
            try {
                if (navigator.audioSession) {
                    navigator.audioSession.type = 'playback';
                }
                if (!audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) audioCtx = new AudioContextClass();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                if (audioCtx && hacerPipInicial) {
                    // 1. "Pip" corto al tocar el botón para confirmar inicio y destrabar el parlante
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1050, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.09);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.1);

                    // 2. Mantener el canal abierto en silencio para que watchOS/iOS no lo cierre antes de 00:00
                    if (nodoSilencioso) { try { nodoSilencioso.stop(); } catch (e) {} }
                    const oscVivo = audioCtx.createOscillator();
                    const gainVivo = audioCtx.createGain();
                    gainVivo.gain.setValueAtTime(0.00001, audioCtx.currentTime);
                    oscVivo.connect(gainVivo);
                    gainVivo.connect(audioCtx.destination);
                    oscVivo.start();
                    nodoSilencioso = oscVivo;
                }
            } catch (e) {}
        }

        function sonarAlarmaGym() {
            // 1. Vibración física (en dispositivos compatibles como Android)
            if (navigator.vibrate) navigator.vibrate([300, 120, 300, 120, 450]);
            // 2. Triple pitido deportivo ("Beep-Beep-Beep") para iPhone y Apple Watch
            try {
                desbloquearAudio(false);
                if (!audioCtx) return;
                [0, 0.22, 0.44].forEach(delay => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime + delay);
                    gain.gain.setValueAtTime(0.5, audioCtx.currentTime + delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + 0.16);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + delay);
                    osc.stop(audioCtx.currentTime + delay + 0.17);
                });
                if (nodoSilencioso) {
                    setTimeout(() => { try { nodoSilencioso.stop(); nodoSilencioso = null; } catch (e) {} }, 700);
                }
            } catch (e) {}
        }

        function guardarEstadoTimer() {
            localStorage.setItem('gymtrack_timer_v1', JSON.stringify({
                finTimer: finTimer,
                serieActual: serieActual,
                timestamp: Date.now()
            }));
        }

        function iniciarTimer(segundos) {
            desbloquearAudio(true);
            mantenerPantallaEncendida(true);
            if (navigator.vibrate) navigator.vibrate(40);
            finTimer = Date.now() + (segundos * 1000);
            document.getElementById('tarjeta-principal').classList.remove('alerta-neon');
            guardarEstadoTimer();
            actualizarRelojEnVivo();
            if (intervaloTimer) clearInterval(intervaloTimer);
            intervaloTimer = setInterval(actualizarRelojEnVivo, 250);
        }

        function detenerTimer() {
            if (navigator.vibrate) navigator.vibrate(30);
            finTimer = 0;
            if (intervaloTimer) { clearInterval(intervaloTimer); intervaloTimer = null; }
            mantenerPantallaEncendida(false);
            if (nodoSilencioso) { try { nodoSilencioso.stop(); nodoSilencioso = null; } catch (e) {} }
            document.getElementById('reloj-display').innerText = "00:00";
            document.getElementById('tarjeta-principal').classList.remove('alerta-neon');
            const bTimer = document.getElementById('burbuja-timer');
            if (bTimer) bTimer.innerText = '⏱️';
            guardarEstadoTimer();
        }

        function reiniciarSeries() {
            if (navigator.vibrate) navigator.vibrate(50);
            serieActual = 1;
            document.getElementById('num-serie').innerText = "1";
            guardarEstadoTimer();
        }

        function actualizarRelojEnVivo() {
            const bTimer = document.getElementById('burbuja-timer');
            const display = document.getElementById('reloj-display');
            if (!finTimer) return;

            const restantes = Math.ceil((finTimer - Date.now()) / 1000);
            if (restantes > 0) {
                const min = String(Math.floor(restantes / 60)).padStart(2, '0');
                const seg = String(restantes % 60).padStart(2, '0');
                const textoHora = `${min}:${seg}`;
                if (display) display.innerText = textoHora;
                if (bTimer) bTimer.innerText = `⏱️ ${min}:${seg}`;
            } else {
                // ¡Llegó a 00:00! Recién acá sumamos +1 al contador de series
                finTimer = 0;
                if (intervaloTimer) { clearInterval(intervaloTimer); intervaloTimer = null; }
                mantenerPantallaEncendida(false);
                serieActual++;
                const spanSerie = document.getElementById('num-serie');
                if (spanSerie) spanSerie.innerText = serieActual;
                if (display) display.innerText = "¡A TIRAR! 🔥";
                if (bTimer) bTimer.innerText = "⏱️ ¡YA!";
                guardarEstadoTimer();
                sonarAlarmaGym();
                const tarjeta = document.getElementById('tarjeta-principal');
                tarjeta.classList.add('alerta-neon');
                setTimeout(() => {
                    tarjeta.classList.remove('alerta-neon');
                    if (bTimer && !finTimer) bTimer.innerText = '⏱️';
                }, 4000);
            }
        }

        function guardarSesionChat() {
            localStorage.setItem('gymtrack_chat_v1', JSON.stringify({
                timestamp: Date.now(),
                historial: historialChat,
                burbujas: burbujasGuardadas
            }));
        }

        function limpiarChatCompleto() {
            historialChat = [];
            burbujasGuardadas = [];
            localStorage.removeItem('gymtrack_chat_v1');
            chatMensajes.innerHTML = '';
            restaurandoMemoria = true;
            agregarBurbuja("🧹 **Chat limpio.** Memoria de la sesión reiniciada desde cero.", 'ia');
            restaurandoMemoria = false;
        }

        function restaurarSesionYTimer() {
            // 1. Restaurar chat si tiene menos de 4 horas
            try {
                const chatGuardado = JSON.parse(localStorage.getItem('gymtrack_chat_v1') || 'null');
                if (chatGuardado && (Date.now() - chatGuardado.timestamp) < TIEMPO_EXPIRACION_MS) {
                    historialChat = chatGuardado.historial || [];
                    burbujasGuardadas = chatGuardado.burbujas || [];
                    if (burbujasGuardadas.length > 0) {
                        chatMensajes.innerHTML = '';
                        restaurandoMemoria = true;
                        burbujasGuardadas.forEach(b => agregarBurbuja(b.texto, b.remitente));
                        restaurandoMemoria = false;
                    }
                } else {
                    localStorage.removeItem('gymtrack_chat_v1');
                }
            } catch (e) {}

            // 2. Restaurar Temporizador y Series si tienen menos de 4 horas
            try {
                const timerGuardado = JSON.parse(localStorage.getItem('gymtrack_timer_v1') || 'null');
                if (timerGuardado && (Date.now() - timerGuardado.timestamp) < TIEMPO_EXPIRACION_MS) {
                    serieActual = timerGuardado.serieActual || 1;
                    document.getElementById('num-serie').innerText = serieActual;
                    if (timerGuardado.finTimer && timerGuardado.finTimer > Date.now()) {
                        finTimer = timerGuardado.finTimer;
                        actualizarRelojEnVivo();
                        intervaloTimer = setInterval(actualizarRelojEnVivo, 250);
                    }
                } else {
                    localStorage.removeItem('gymtrack_timer_v1');
                }
            } catch (e) {}
        }
        const chatSheet = document.getElementById('chat-sheet');
        const overlay = document.getElementById('overlay');
        const chatMensajes = document.getElementById('chat-mensajes');
        const chatInput = document.getElementById('chat-input-text'); // Necesitamos agregarle este ID al input HTML

        let posicionAntesDelChat = 0;

        function abrirChat() {
            posicionAntesDelChat = window.scrollY || document.documentElement.scrollTop;
            document.body.classList.add('chat-abierto');
            chatSheet.classList.add('open');
            overlay.classList.add('active');
            if (navigator.vibrate) navigator.vibrate(50);
            setTimeout(() => {
                chatMensajes.scrollTop = chatMensajes.scrollHeight;
                if (window.innerWidth <= 330 && altoSinTeclado <= 400) {
                    window.scrollTo(0, document.body.scrollHeight);
                }
            }, 50);
        }

        function cerrarChat() {
            chatSheet.classList.remove('open');
            overlay.classList.remove('active');
            document.body.classList.remove('chat-abierto');
            window.scrollTo(0, posicionAntesDelChat);
        }

        // Permitir mover el texto largo hacia los lados arrastrando el dedo sobre el recuadro de texto
        let touchXInput = 0;
        let scrollInicialInput = 0;
        chatInput.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchXInput = e.touches[0].clientX;
                scrollInicialInput = chatInput.scrollLeft;
            }
        }, { passive: true });

        chatInput.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && chatInput.scrollWidth > chatInput.clientWidth) {
                const desplazamiento = touchXInput - e.touches[0].clientX;
                chatInput.scrollLeft = scrollInicialInput + desplazamiento;
            }
        }, { passive: true });

        // Esta función empaqueta tu pregunta junto con tus datos del día o ejecuta comandos
        async function enviarMensaje() {
            let pregunta = chatInput.value.trim();
            if (!pregunta) return;

            const comandoLimpio = pregunta.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[.,!?¿¡]/g, "").trim();

            // A. Comando para limpiar el chat (sin confundirse con preguntas de comida)
            const pideBorrarChat = /^(limpiar|borrar|eliminar|reiniciar|vaciar|clear|reset)$/.test(comandoLimpio) ||
                                   /^(limpiar|borrar|eliminar|reiniciar|vaciar)\s+(el\s+|la\s+|los\s+|todo\s+el\s+)?(chat|historial|mensajes|conversacion|sesion|memoria)$/.test(comandoLimpio);
            if (pideBorrarChat) {
                chatInput.value = '';
                limpiarChatCompleto();
                return;
            }

            // B. Comando AYUDA / COMANDOS (Machete limpio para Usuarios - 0 tokens)
            if (/^(ayuda|comandos|menu|help)$/.test(comandoLimpio)) {
                agregarBurbuja(pregunta, 'usuario');
                chatInput.value = '';
                agregarBurbuja(
                    "📋 **COMANDOS RÁPIDOS DE GYMTRACK**\n\n" +
                    "🏋️ **Entrenamiento:**\n" +
                    "• **hoy** o **rutina**: Tu rutina de hoy + cuidados de lesiones.\n" +
                    "• **cuidados** o **lesion**: Checklist articular y agarres.\n" +
                    "• **barra [kg]** *(ej: barra 90)*: Calcula qué discos poner de cada lado.\n\n" +
                    "🥩 **Nutrición:**\n" +
                    "• **proxima** o **comida**: Qué te toca comer o suplementar ahora.\n" +
                    "• **atrasado** o **recalcular**: Reacomoda tus comidas restantes del día.\n" +
                    "• **finde** o **libre**: Activa el Bolsillo Calórico (Fernet / libre).\n" +
                    "• **compras**: Lista de supermercado semanal en crudo.\n\n" +
                    "🧹 **Control:**\n" +
                    "• **limpiar** o **borrar**: Vacía el chat actual.",
                    'ia'
                );
                return;
            }

            // C. Comando Secreto ADMIN / DEV (Exclusivo Desarrollador - 0 tokens)
            if (/^(admin|dev|sistema|panel)$/.test(comandoLimpio)) {
                agregarBurbuja(pregunta, 'usuario');
                chatInput.value = '';
                agregarBurbuja(
                    "🛠️ **PANEL SECRETO DE DESARROLLADOR**\n\n" +
                    "• **estado** o **diagnostico**: Radiografía técnica del dispositivo, pantalla, memoria y señal.\n" +
                    "• **memoria**: Muestra el historial interno exacto que viaja a la IA.\n" +
                    "• **modelo** o **motor**: Qué modelo de la cascada respondió último.\n" +
                    "• **gasto** o **tokens**: Reporte de billetera (Hoy, Mes e Histórico en USD y ARS).\n" +
                    "• **reiniciar gasto**: Pone la billetera del servidor en $0.00.\n" +
                    "• **reset total**: Borra de raíz chat, series y temporizador del aparato.",
                    'ia'
                );
                return;
            }

            // D. Comando ESTADO / DIAGNOSTICO (Radiografía en vivo - 0 tokens)
            if (/^(estado|diagnostico|status|info)$/.test(comandoLimpio)) {
                agregarBurbuja(pregunta, 'usuario');
                chatInput.value = '';
                const esRelojActual = window.innerWidth <= 330 && altoSinTeclado <= 400;
                const chatData = JSON.parse(localStorage.getItem('gymtrack_chat_v1') || 'null');
                const minRestantes = chatData ? Math.max(0, Math.round((TIEMPO_EXPIRACION_MS - (Date.now() - chatData.timestamp)) / 60000)) : 240;
                agregarBurbuja(
                    "📡 **DIAGNÓSTICO DE SISTEMA EN VIVO**\n\n" +
                    "• **Dispositivo:** **" + (esRelojActual ? "Apple Watch" : "Celular / PC") + "**\n" +
                    "• **Pantalla medida:** **" + window.innerWidth + "px** ancho x **" + altoSinTeclado + "px** alto (sin teclado)\n" +
                    "• **Memoria IA:** **" + historialChat.length + " / 12** mensajes activos\n" +
                    "• **Vencimiento sesión:** en **" + minRestantes + " min**\n" +
                    "• **Serie actual:** **Serie " + serieActual + "**\n" +
                    "• **Temporizador:** **" + (finTimer > Date.now() ? "Corriendo" : "En espera") + "**\n" +
                    "• **Señal:** **" + (navigator.onLine ? "Online ✅" : "Sin conexión ⚠️") + "**",
                    'ia'
                );
                return;
            }

            // E. Comando MEMORIA (Ver historial interno - 0 tokens)
            if (/^(memoria|ver memoria|historial)$/.test(comandoLimpio)) {
                agregarBurbuja(pregunta, 'usuario');
                chatInput.value = '';
                const textoMem = historialChat.length > 0
                    ? historialChat.map((m, i) => `${i + 1}) **${m.rol}:** ${m.texto}`).join("\n\n")
                    : "La memoria temporal está vacía en este momento.";
                agregarBurbuja("🧠 **MEMORIA INTERNA ACTIVA (" + historialChat.length + " msgs):**\n\n" + textoMem, 'ia');
                return;
            }

            // F. Comando RESET TOTAL (Fábrica - 0 tokens)
            if (/^(reset total|borrado total|hard reset)$/.test(comandoLimpio)) {
                chatInput.value = '';
                detenerTimer();
                reiniciarSeries();
                localStorage.removeItem('gymtrack_timer_v1');
                limpiarChatCompleto();
                agregarBurbuja("⚡ **Reset Total completado.** Chat, memoria de 4 hs, temporizador y contador de series reiniciados de fábrica.", 'ia');
                return;
            }

            // G. Calculadora Rápida de Barra Olímpica: "barra 90" (0 tokens)
            const matchBarra = comandoLimpio.match(/^barra\s+(\d+(?:[.,]\d+)?)\s*(?:kg|kilos)?$/);
            if (matchBarra) {
                agregarBurbuja(pregunta, 'usuario');
                chatInput.value = '';
                const pesoTotal = parseFloat(matchBarra[1].replace(',', '.'));
                if (pesoTotal <= 20) {
                    agregarBurbuja("🏋️ La barra olímpica vacía ya pesa **20 kg**. Indicá un peso mayor a 20 (ej: **barra 60**).", 'ia');
                    return;
                }
                let porLado = (pesoTotal - 20) / 2;
                let resto = porLado;
                const discosDisp = [20, 15, 10, 5, 2.5, 1.25];
                const conteo = [];
                discosDisp.forEach(d => {
                    const cant = Math.floor((resto + 0.001) / d);
                    if (cant > 0) {
                        conteo.push(`**${cant}x ${d} kg**`);
                        resto = +(resto - cant * d).toFixed(2);
                    }
                });
                agregarBurbuja(
                    `🏋️ **ARMADO DE BARRA (${pesoTotal} kg totales)**\n` +
                    `• Barra olímpica: **20 kg**\n` +
                    `• Peso a cargar por lado: **${porLado} kg**\n` +
                    `• Discos de cada lado: ${conteo.join(" + ") || "Sin discos"}` +
                    (resto > 0 ? `\n*(Resto sin disco estándar: ${resto} kg por lado)*` : ""),
                    'ia'
                );
                return;
            }

            // 1. Mostrar tu mensaje en la pantalla
            agregarBurbuja(pregunta, 'usuario');
            chatInput.value = ''; // Limpiar la barra

            // H. Atajos Inteligentes de 1 palabra (expanden la orden antes de viajar a la IA)
            const atajosIA = {
                "hoy": "Pasame mi rutina completa de hoy detallando ejercicios, series y repeticiones, e incluí obligatoriamente los cuidados y adaptaciones para mi epicondilitis.",
                "rutina": "Pasame mi rutina completa de hoy detallando ejercicios, series y repeticiones, e incluí obligatoriamente los cuidados y adaptaciones para mi epicondilitis.",
                "cuidados": "Recordame el checklist de cuidados articulares, tipos de agarre, uso de straps y precauciones que debo aplicar hoy por mi epicondilitis y lesiones del perfil.",
                "lesion": "Recordame el checklist de cuidados articulares, tipos de agarre, uso de straps y precauciones que debo aplicar hoy por mi epicondilitis y lesiones del perfil.",
                "proxima": "Según la hora actual, decime cuál es la próxima comida o suplemento que me toca hoy y qué cantidades exactas lleva.",
                "comida": "Según la hora actual, decime cuál es la próxima comida o suplemento que me toca hoy y qué cantidades exactas lleva.",
                "atrasado": "Se me atrasó el horario hoy. Recalculame y reacomodá las comidas que me quedan en el día según la hora actual para cumplir mis macros sin irme a dormir pesado.",
                "recalcular": "Se me atrasó el horario hoy. Recalculame y reacomodá las comidas que me quedan en el día según la hora actual para cumplir mis macros sin irme a dormir pesado.",
                "finde": "Activá el protocolo de Bolsillo Calórico de fin de semana: recalculame las comidas de hoy sabiendo que a la noche tengo comida libre y Fernet.",
                "libre": "Activá el protocolo de Bolsillo Calórico de fin de semana: recalculame las comidas de hoy sabiendo que a la noche tengo comida libre y Fernet.",
                "compras": "Armame la lista de compras de supermercado para toda la semana con pesos exactos en crudo/seco agrupada por categorías."
            };
            if (atajosIA[comandoLimpio]) {
                pregunta = atajosIA[comandoLimpio];
            }

            // 2. Detectar si estás desde el Apple Watch (Ancho <= 330px Y Alto sin teclado <= 400px)
            const esReloj = window.innerWidth <= 330 && altoSinTeclado <= 400;
            const infoDispositivo = {
                tipo: esReloj ? "Apple Watch" : "Celular / PC",
                interfaz: esReloj ? "pantalla pequeña (modo ultra compacto)" : "pantalla estándar",
                ancho_px: window.innerWidth,
                alto_px: altoSinTeclado
            };

            // 3. Empaquetar el "Expediente Secreto" comprimido para ahorrar un 25% de tokens
            const expedienteSecreto = `PERFIL:${JSON.stringify(perfilDatos)}\nPLAN_7_DIAS:${JSON.stringify(planSemanal)}\nDIA_EN_PANTALLA:${diaActualRenderizado}`;
            
            // Este objeto viaja a Google Apps Script (ahora incluye la memoria temporal)
            const paqueteParaIA = {
                contexto: expedienteSecreto,
                dispositivo: infoDispositivo,
                historial: historialChat,
                mensaje: pregunta
            };

            // 3. Mostrar estado "Escribiendo..."
            const idTyping = agregarBurbuja("Analizando tus macros...", 'ia', true);

            // 4. Conexión Real con Gemini a través de Google Apps Script
            try {
                const respuesta = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(paqueteParaIA) // Enviamos pregunta + datos biométricos
                    // NOTA: No usamos 'headers: { "Content-Type": "application/json" }' 
                    // porque Google Apps Script requiere que las peticiones POST desde el navegador 
                    // se envíen como texto plano para evitar el bloqueo estricto de CORS.
                });
                
                const datosRespuesta = await respuesta.json();
                
                // Borramos el mensaje de "Escribiendo..."
                document.getElementById(idTyping).remove();
                
                // Dibujamos la respuesta real de Gemini
                agregarBurbuja(datosRespuesta.respuesta, 'ia');

                // Si hubo un error de API/cuota, devolvemos tu pregunta a la barra para no perderla
                if (datosRespuesta.respuesta.startsWith("Error")) {
                    chatInput.value = pregunta;
                } else {
                    // 1. Guardamos el 100% de tu pregunta intacta
                    historialChat.push({ rol: "Usuario", texto: pregunta });
                    
                    // 2. Si la respuesta de la IA fue gigante (>350 letras), la recortamos en la memoria para ahorrar tokens
                    const respuestaParaMemoria = datosRespuesta.respuesta.length > 350 
                        ? datosRespuesta.respuesta.substring(0, 350) + "... [respuesta extensa resumida en memoria]" 
                        : datosRespuesta.respuesta;
                    historialChat.push({ rol: "GymTrack", texto: respuestaParaMemoria });

                    // 3. Ventana inteligente: mantenemos solo los últimos 12 mensajes (6 idas y vueltas completas)
                    if (historialChat.length > 12) {
                        historialChat = historialChat.slice(-12);
                    }
                }
                
                // Vibración de victoria cuando llega la respuesta
                if (navigator.vibrate) navigator.vibrate([30, 50, 30]); 
                
            } catch (error) {
                console.error("Error en el chat:", error);
                document.getElementById(idTyping).remove();
                // BLINDAJE WI-FI: Devolvemos el texto a la caja para que no tengas que volver a escribirlo ni dictarlo
                chatInput.value = pregunta;
                agregarBurbuja("⚠️ Se cortó la señal. Tu mensaje quedó guardado en la barra de abajo para que le des enviar de nuevo apenas vuelva el Wi-Fi.", 'ia');
            }
        }

        // Función para dibujar los mensajes en el chat
        function agregarBurbuja(texto, remitente, esTyping = false) {
            const id = 'msg-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'burbuja-chat';
            div.style.margin = "10px 0";
            div.style.padding = "12px 16px";
            div.style.borderRadius = "16px";
            div.style.maxWidth = "85%";
            div.style.lineHeight = "1.4";
            div.style.fontSize = "0.95rem";
            div.style.flexShrink = "0"; // Prohibido aplastar el globo verticalmente
            div.style.height = "auto";
            div.style.overflowWrap = "break-word"; // Corta palabras o links largos dentro del globo
            div.style.wordBreak = "break-word";
            div.style.boxSizing = "border-box";
            
            if (remitente === 'usuario') {
                div.style.background = "var(--neon-cyan)";
                div.style.color = "#000";
                div.style.marginLeft = "auto";
                div.style.borderBottomRightRadius = "4px";
            } else {
                div.style.background = "#2a2a2a";
                div.style.color = "#fff";
                div.style.marginRight = "auto";
                div.style.borderBottomLeftRadius = "4px";
                if (esTyping) div.style.fontStyle = "italic";
            }
            
            if (remitente === 'ia' && !esTyping) {
                // 1. Quitar los signos # sueltos al inicio de los renglones
                let textoFormateado = texto.replace(/^#+\s*/gm, '');
                // 2. Pintar todo lo que esté entre **dobles asteriscos** en color Cian Neón brillante
                textoFormateado = textoFormateado.replace(/\*\*(.*?)\*\*/g, '<strong style="color: var(--neon-cyan); text-shadow: 0 0 6px rgba(0,255,204,0.35);">$1</strong>');
                // 3. Transformar los "Enters" en saltos de línea reales (<br>)
                div.innerHTML = textoFormateado.replace(/\n/g, '<br>');
            } else {
                div.innerText = texto;
            }

            // Agregar botoncito de copiar en todos los globos (excepto en el "Analizando...")
            if (!esTyping) {
                const filaCopiar = document.createElement('div');
                filaCopiar.className = 'contenedor-copiar';

                const iconoHojasSVG = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
                const iconoCheckSVG = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>';

                const btnCopiar = document.createElement('button');
                btnCopiar.type = 'button';
                btnCopiar.className = 'btn-copiar-globo' + (remitente === 'usuario' ? ' usuario-btn' : '');
                btnCopiar.innerHTML = iconoHojasSVG;

                btnCopiar.onclick = async () => {
                    if (navigator.vibrate) navigator.vibrate(25);
                    // Limpiamos los asteriscos de formato para que pegue el texto limpio
                    const textoLimpio = texto.replace(/^#+\s*/gm, '').replace(/\*\*(.*?)\*\*/g, '$1');
                    try {
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            await navigator.clipboard.writeText(textoLimpio);
                        } else {
                            const tempArea = document.createElement('textarea');
                            tempArea.value = textoLimpio;
                            document.body.appendChild(tempArea);
                            tempArea.select();
                            document.execCommand('copy');
                            document.body.removeChild(tempArea);
                        }
                        btnCopiar.innerHTML = iconoCheckSVG;
                        setTimeout(() => { btnCopiar.innerHTML = iconoHojasSVG; }, 1400);
                    } catch (e) {}
                };

                filaCopiar.appendChild(btnCopiar);
                div.appendChild(filaCopiar);
            }

            chatMensajes.appendChild(div);
            
            // Guardar el globo en la memoria de 4 horas (salvo que sea el "Escribiendo..." o un error de red)
            if (!esTyping && !restaurandoMemoria && !texto.startsWith("Error") && !texto.startsWith("⚠️ Se cortó")) {
                burbujasGuardadas.push({ texto: texto, remitente: remitente });
                if (burbujasGuardadas.length > 24) burbujasGuardadas = burbujasGuardadas.slice(-24);
                guardarSesionChat();
            }

            // Hacer scroll automático hacia abajo (en Celular y en modo nativo del Reloj)
            chatMensajes.scrollTop = chatMensajes.scrollHeight;
            if (window.innerWidth <= 330 && altoSinTeclado <= 400 && chatSheet.classList.contains('open')) {
                window.scrollTo(0, document.body.scrollHeight);
            }
            return id;
        }

        // Ejecutar carga y restaurar memoria de 4 horas al abrir la app
        restaurarSesionYTimer();
        cargarDatos();
    </script>   
</body>
